version: '3.8'

services:
  # =============================================================================
  # DATABASES
  # =============================================================================
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev", "test", "prod"]
    networks:
      - app-network

  portfolio-db:
    image: postgres:15-alpine
    container_name: portfolio-db
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
    volumes:
      - portfolio_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev", "test", "prod"]
    networks:
      - app-network

  market-db:
    image: postgres:15-alpine
    container_name: market-db
    environment:
      POSTGRES_DB: market_db
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_password
    volumes:
      - market_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_user -d market_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev", "test", "prod"]
    networks:
      - app-network

  # =============================================================================
  # DEV DATABASES VISUALIZATION
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    profiles: ["dev"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
  

  # =============================================================================
  # TEST DATABASES
  # =============================================================================
  auth-db-test:
    image: postgres:15-alpine
    container_name: auth-db-test
    environment:
      POSTGRES_DB: auth_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test
    ports:
      - "5435:5432"
    profiles: ["test"]
    networks:
      - app-network

  portfolio-db-test:
    image: postgres:15-alpine
    container_name: portfolio-db-test
    environment:
      POSTGRES_DB: portfolio_test
      POSTGRES_USER: portfolio_test
      POSTGRES_PASSWORD: portfolio_test
    ports:
      - "5436:5432"
    profiles: ["test"]
    networks:
      - app-network

  market-db-test:
    image: postgres:15-alpine
    container_name: market-db-test
    environment:
      POSTGRES_DB: market_test
      POSTGRES_USER: market_test
      POSTGRES_PASSWORD: market_test
    ports:
      - "5437:5432"
    profiles: ["test"]
    networks:
      - app-network

  # =============================================================================
  # BACKEND SERVICES
  # =============================================================================
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://auth_user:auth_password@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./services/auth/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["prod"]
    networks:
      - app-network

  auth-service-dev:
    build:
      context: ./services/auth
      dockerfile: Dockerfile.dev
    container_name: auth-service-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://auth_user:auth_password@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./services/auth:/app
      - /app/node_modules
      - ./services/auth/logs:/app/logs
    profiles: ["dev"]
    networks:
      - app-network

  portfolio-service:
    build:
      context: ./services/portfolio
      dockerfile: Dockerfile
    container_name: portfolio-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://portfolio_user:portfolio_password@portfolio-db:5432/portfolio_db
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3002:3002"
    depends_on:
      portfolio-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/portfolio/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["prod"]
    networks:
      - app-network

  portfolio-service-dev:
    build:
      context: ./services/portfolio
      dockerfile: Dockerfile.dev
    container_name: portfolio-service-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://portfolio_user:portfolio_password@portfolio-db:5432/portfolio_db
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3002:3002"
    depends_on:
      portfolio-db:
        condition: service_healthy
    volumes:
      - ./services/portfolio:/app
      - /app/node_modules
      - ./services/portfolio/logs:/app/logs
    profiles: ["dev"]
    networks:
      - app-network

  market-service:
    build:
      context: ./services/market-data
      dockerfile: Dockerfile
    container_name: market-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://market_user:market_password@market-db:5432/market_db
      JWT_SECRET: ${JWT_SECRET}
      ANGEL_ONE_API_KEY: ${ANGEL_ONE_API_KEY}
      ANGEL_ONE_CLIENT_ID: ${ANGEL_ONE_CLIENT_ID}
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      market-db:
        condition: service_healthy
    volumes:
      - ./services/market-data/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["prod"]
    networks:
      - app-network

  market-service-dev:
    build:
      context: ./services/market-data
      dockerfile: Dockerfile.dev
    container_name: market-service-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://market_user:market_password@market-db:5432/market_db
      JWT_SECRET: ${JWT_SECRET}
      ANGEL_ONE_API_KEY: ${ANGEL_ONE_API_KEY}
      ANGEL_ONE_CLIENT_ID: ${ANGEL_ONE_CLIENT_ID}
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      market-db:
        condition: service_healthy
    volumes:
      - ./services/market-data:/app
      - /app/node_modules
      - ./services/market-data/logs:/app/logs
    profiles: ["dev"]
    networks:
      - app-network

  # =============================================================================
  # FRONTEND
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      REACT_APP_API_URL: http://localhost
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - portfolio-service
      - market-service
    profiles: ["prod"]
    networks:
      - app-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    environment:
      VITE_REACT_APP_API_URL: http://nginx-dev
      VITE_NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    profiles: ["dev"]
    networks:
      - app-network

  # =============================================================================
  # REVERSE PROXY
  # =============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - auth-service
      - portfolio-service
      - market-service
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    profiles: ["prod"]
    networks:
      - app-network

  nginx-dev:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-dev
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      - frontend-dev
      - auth-service-dev
      - portfolio-service-dev
      - market-service-dev
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    profiles: ["dev"]
    networks:
      - app-network

  # =============================================================================
  # OBSERVABILITY STACK
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    profiles: ["dev", "prod", "monitoring"]
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped
    profiles: ["dev", "prod", "monitoring"]
    networks:
      - app-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://auth_user:auth_password@auth-db:5432/auth_db?sslmode=disable"
    depends_on:
      - auth-db
    restart: unless-stopped
    profiles: ["dev", "prod", "monitoring"]
    networks:
      - app-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    profiles: ["dev", "prod", "monitoring"]
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=live
      - GF_LIVE_ALLOWED_ORIGINS=*
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["dev", "prod", "monitoring"]
    networks:
      - app-network

  # =============================================================================
  # STREAMING & MESSAGE QUEUE
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --replica-read-only no
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: ["dev", "prod", "streaming"]
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    profiles: ["dev", "prod", "streaming"]
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    restart: unless-stopped
    profiles: ["dev", "prod", "streaming"]
    networks:
      - app-network

  # =============================================================================
  # SECURITY ANALYSIS - WAZUH
  # =============================================================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./monitoring/wazuh/config:/wazuh-config-mount
    restart: unless-stopped
    profiles: ["dev", "prod", "security"]
    networks:
      - app-network

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./monitoring/wazuh/config/wazuh_indexer_ssl_certs:/usr/share/wazuh-indexer/certs
    restart: unless-stopped
    profiles: ["dev", "prod", "security"]
    networks:
      - app-network

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    volumes:
      - ./monitoring/wazuh/config/wazuh_indexer_ssl_certs:/usr/share/wazuh-dashboard/certs
      - ./monitoring/wazuh/config/wazuh_dashboard_ssl_certs:/usr/share/wazuh-dashboard/certs
    depends_on:
      - wazuh-indexer
    links:
      - wazuh-indexer:wazuh-indexer
      - wazuh-manager:wazuh-manager
    restart: unless-stopped
    profiles: ["dev", "prod", "security"]
    networks:
      - app-network

  # =============================================================================
  # CI/CD
  # =============================================================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    user: root
    profiles: ["ci"]
    networks:
      - app-network

  # =============================================================================
  # E2E TESTING
  # =============================================================================
  e2e-tests:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: e2e-tests
    depends_on:
      - nginx
    volumes:
      - ./e2e/test-results:/app/test-results
      - ./e2e/reports:/app/reports
    environment:
      - BASE_URL=http://nginx
    profiles: ["test"]
    networks:
      - app-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  auth_db_data:
  portfolio_db_data:
  market_db_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  jenkins_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  alertmanager_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  wazuh_indexer_data:
  filebeat_etc:
  filebeat_var:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  app-network:
    driver: bridge
