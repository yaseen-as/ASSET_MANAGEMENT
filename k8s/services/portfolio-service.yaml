apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  namespace: asset-management
  labels:
    app: portfolio-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
    spec:
      containers:
      - name: portfolio-service
        image: yaseen-as/asset-management-portfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: asset-management-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: asset-management-config
              key: PORTFOLIO_SERVICE_PORT
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?schema=public"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: asset-management-config
              key: PORTFOLIO_DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: asset-management-config
              key: PORTFOLIO_DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: asset-management-config
              key: PORTFOLIO_DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: asset-management-secrets
              key: PORTFOLIO_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: asset-management-secrets
              key: PORTFOLIO_DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: asset-management-secrets
              key: JWT_SECRET
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: MARKET_SERVICE_URL
          value: "http://market-service:3003"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: asset-management
  labels:
    app: portfolio-service
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
  selector:
    app: portfolio-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-service-hpa
  namespace: asset-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
