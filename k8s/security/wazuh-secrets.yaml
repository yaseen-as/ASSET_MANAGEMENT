---
# Wazuh Secrets
# IMPORTANT: Change these passwords in production!
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-secrets
  namespace: wazuh
type: Opaque
stringData:
  # Wazuh Indexer password (change in production)
  indexer-password: "SecurePassword123!"
  
  # Wazuh API password (change in production)
  api-password: "WazuhAPI2024!"
  
  # Wazuh cluster key (change in production)
  cluster-key: "c98b62a9b6169ac5f67dae55ae4a9088"
  
  # Admin user password for dashboard (change in production)
  admin-password: "AdminSecure2024!"

---
# For production, use this approach to create secrets:
# kubectl create secret generic wazuh-secrets \
#   --from-literal=indexer-password='YourSecurePassword' \
#   --from-literal=api-password='YourAPIPassword' \
#   --from-literal=cluster-key='YourClusterKey' \
#   --from-literal=admin-password='YourAdminPassword' \
#   -n wazuh
