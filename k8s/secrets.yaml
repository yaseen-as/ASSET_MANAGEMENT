apiVersion: v1
kind: Secret
metadata:
  name: asset-management-secrets
  namespace: asset-management
type: Opaque
stringData:
  # JWT Secrets (Change these in production!)
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production-minimum-32-chars"
  JWT_REFRESH_SECRET: "your-refresh-secret-key-change-this-in-production-minimum-32-chars"
  
  # Database Credentials - Auth
  AUTH_DB_USER: "auth_user"
  AUTH_DB_PASSWORD: "auth_password_change_in_production"
  
  # Database Credentials - Portfolio
  PORTFOLIO_DB_USER: "portfolio_user"
  PORTFOLIO_DB_PASSWORD: "portfolio_password_change_in_production"
  
  # Database Credentials - Market
  MARKET_DB_USER: "market_user"
  MARKET_DB_PASSWORD: "market_password_change_in_production"
  
  # Angel One API Credentials
  ANGEL_ONE_CLIENT_ID: "your_angel_one_client_id"
  ANGEL_ONE_API_KEY: "your_angel_one_api_key"
  ANGEL_ONE_SECRET: "your_angel_one_secret"
  
  # Session Secret
  SESSION_SECRET: "your-session-secret-change-this-in-production"
---
# For production, use sealed secrets or external secret management
# Example using Sealed Secrets:
# kubectl create secret generic asset-management-secrets \
#   --from-literal=JWT_SECRET=xxx \
#   --from-literal=JWT_REFRESH_SECRET=xxx \
#   --dry-run=client -o yaml | \
#   kubeseal -o yaml > sealed-secrets.yaml
