apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-market-pvc
  namespace: asset-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-market
  namespace: asset-management
  labels:
    app: postgres-market
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app: postgres-market
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-market
  namespace: asset-management
spec:
  serviceName: postgres-market
  replicas: 1
  selector:
    matchLabels:
      app: postgres-market
  template:
    metadata:
      labels:
        app: postgres-market
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: asset-management-config
              key: MARKET_DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: asset-management-secrets
              key: MARKET_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: asset-management-secrets
              key: MARKET_DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-market-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-market-storage
        persistentVolumeClaim:
          claimName: postgres-market-pvc
